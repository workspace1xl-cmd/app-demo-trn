name: Deploy

# Fully automated deploy on every push to main: apply pending Supabase
# migrations, deploy the onework-api Edge Function, then verify health.
# Vercel deploys itself through its own native GitHub integration and is not
# triggered from here.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token, https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    bnzcjjdhfsdedwljdmjl
#   SUPABASE_DB_PASSWORD    the project's Postgres password

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  database-and-api:
    name: Migrate database and deploy Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Apply pending migrations
        # `supabase link` is deliberately not used here: as of CLI 2.112.0 it
        # calls the platform's project API-keys endpoint, whose response the
        # CLI's own schema validator rejects (SchemaError on `inserted_at`),
        # failing every deploy with "failed to get api keys" even though
        # nothing about this project's migrations or functions is broken.
        # scripts/db-push.sh talks to Postgres directly via --db-url and
        # never calls that endpoint, so it sidesteps the bug entirely.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/db-push.sh

      - name: Deploy onework-api Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy onework-api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt

      - name: Verify health
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/onework-api/health")
            if [ "$status" = "200" ]; then echo "Edge Function healthy."; exit 0; fi
            echo "Attempt $attempt: got HTTP $status, retrying in 5s..."; sleep 5
          done
          echo "Edge Function did not report healthy after deploy."; exit 1
