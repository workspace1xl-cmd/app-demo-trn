services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: onework
      POSTGRES_USER: onework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onework-local-password}
    volumes:
      - onework_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onework -d onework"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://onework:${POSTGRES_PASSWORD:-onework-local-password}@database:5432/onework
      JWT_SECRET: ${JWT_SECRET:-onework-local-jwt-change-for-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  n8n:
    image: n8nio/n8n:1.107.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-onework-local-n8n-encryption-key}
      N8N_USER_MANAGEMENT_DISABLED: "true"
      GENERIC_TIMEZONE: Asia/Kolkata
      ONEWORK_API_URL: http://api:8000
    volumes:
      - onework_n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    command: /bin/sh -c "n8n import:workflow --separate --input=/workflows || true; n8n start"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5678:5678"

volumes:
  onework_postgres:
  onework_n8n:
